elevation_mapper:
  ros__parameters:
    resolution: 0.1          # m per cell
    grid_size: 240           # cells per side (24 m x 24 m)
    hit_threshold: 2         # hits before a cell counts as occupied
    free_clearance: 0.25
    max_range: 30.0
    publish_rate: 2.0        # Hz
    robot_radius: 0.30
    sensor_height: 0.0       # gimbal lidar z offset from base_link
